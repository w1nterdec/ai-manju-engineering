name: Offline contract and pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Check original episode
        run: python -m manju check examples/midnight_letter/episode.json
      - name: Check shared series
        run: python -m manju check-series examples/midnight_letter/series/series.json
      - name: Compile a planning bundle
        run: python -m manju build examples/midnight_letter/episode.json --out build/ci
